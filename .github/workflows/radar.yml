name: BIST Radar (günlük)

on:
  schedule:
    - cron: "0 5 * * 1-5"      # 08:00 TR — sabah kontrolü
    - cron: "0 7-15 * * 1-5"   # 10:00-18:00 TR — saat başı
    - cron: "45 15 * * 1-5"    # 18:45 TR — kapanış
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade borsapy yfinance pandas
      - run: python bist_radar.py
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}

      - name: JSON'u depoya yaz
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -q || true
          git push

      - name: Kırılma varsa Issue aç (e-posta bildirimi)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f output/radar.json ]; then
            BODY="radar.json hiç üretilmedi — betik çalışmadı. Actions loguna bak."
            STATUS="SORUN VAR"
          else
            STATUS=$(python -c "import json;print(json.load(open('output/radar.json'))['saglik']['ozet'])")
            BODY=$(python -c "import json;d=json.load(open('output/radar.json'))['saglik']['hatali_moduller'];print('\n'.join(f'- **{k}**: {v}' for k,v in d.items()))")
          fi
          echo "Sağlık: $STATUS"
          if [ "$STATUS" != "TAMAM" ]; then
            gh label create radar-hata --color d73a4a --description "Veri modülü kırıldı" --force || true
            OPEN=$(gh issue list --label radar-hata --state open --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              gh issue create --label radar-hata --assignee OrhanBoyali \
                --title "⚠️ Radar veri hatası — $(date -u +%F)" \
                --body "$(printf '@OrhanBoyali otomatik tespit. Hatalı modüller:\n\n%s\n\nYedek (Yahoo) devrede olabilir. Düzeltince bu issue'"'"'yu kapat.' "$BODY")"
            fi
          fi
