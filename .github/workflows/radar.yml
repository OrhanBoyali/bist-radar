name: BIST Radar (günlük)

on:
  schedule:
    # Piyasa saatlerinde saat başı: 07-15 UTC = 10:00-18:00 TR, Pzt-Cum
    - cron: "0 7-15 * * 1-5"
    # Kapanış sonrası kesin veri: 15:45 UTC = 18:45 TR
    - cron: "45 15 * * 1-5"
    # Sabah kontrolü (Yahoo bir gün gecikirse önceki günün kesin kapanışı): 05:00 UTC = 08:00 TR
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python bist_radar.py
      - name: JSON'u depoya yaz
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/radar.json
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
