name: BIST Radar (günlük)

on:
  # Zamanlama cron-job.org'dan yapılır (hafta içi 08:17-18:17 saatlik + 18:52, İstanbul saati).
  # GitHub'ın kendi zamanlayıcısı 23 Eyl'de kapatıldı: saatlerce gecikip mesai dışında çalışıyor,
  # cron-job.org'un çalışmalarıyla çakışıyordu.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # tetiklendiği anın değil, başladığı anın en güncel hali (22 Eyl çakışma hatası)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade borsapy yfinance pandas
      - run: python bist_radar.py
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}

      - name: JSON'u depoya yaz
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -q -m "radar: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs -q origin main; then
              git push -q origin HEAD:main && { echo "Yazıldı (deneme $i)"; exit 0; }
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 5))
          done
          echo "::error::Depoya yazılamadı (5 deneme)"; exit 1

      - name: Kırılma varsa Issue aç (e-posta bildirimi)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f output/radar.json ]; then
            BODY="radar.json hiç üretilmedi — betik çalışmadı. Actions loguna bak."
            STATUS="SORUN VAR"
          else
            STATUS=$(python -c "
          import json
          try: print(json.load(open('output/radar.json'))['saglik']['ozet'])
          except Exception as e: print('SORUN VAR')")
            BODY=$(python -c "
          import json
          try:
              d=json.load(open('output/radar.json'))['saglik']['hatali_moduller']
              print('\n'.join(f'- **{k}**: {v}' for k,v in d.items()))
          except Exception as e: print(f'- **radar.json okunamadı**: {e}')")
          fi
          echo "Sağlık: $STATUS"
          if [ "$STATUS" != "TAMAM" ]; then
            gh label create radar-hata --color d73a4a --description "Veri modülü kırıldı" --force || true
            OPEN=$(gh issue list --label radar-hata --state open --json number --jq 'length')
            if [ "$OPEN" = "0" ]; then
              gh issue create --label radar-hata --assignee OrhanBoyali \
                --title "⚠️ Radar veri hatası — $(date -u +%F)" \
                --body "$(printf '@OrhanBoyali otomatik tespit. Hatalı modüller:\n\n%s\n\nYedek (Yahoo) devrede olabilir. Düzeltince bu issue'"'"'yu kapat.' "$BODY")"
            fi
          fi
