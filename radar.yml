name: BIST Radar (günlük)

on:
  schedule:
    # Her iş günü 15:45 UTC = 18:45 Türkiye (borsa kapanışı sonrası)
    - cron: "45 15 * * 1-5"
  workflow_dispatch:   # elle de tetiklenebilir (Actions sekmesinden "Run workflow")

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: pip install yfinance pandas

      - name: Radarı çalıştır
        run: python bist_radar.py

      - name: JSON'u depoya yaz
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/radar.json
          git diff --cached --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
